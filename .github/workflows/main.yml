name: Render Rmd and Deploy to Pages

on:
  push:
    branches:
      - master
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'

      - name: Instalar paquetes de R
        run: |
          Rscript -e 'install.packages(c("rmarkdown","knitr","tidyverse"))'

      - name: Render Rmarkdown a HTML
        run: |
          Rscript -e 'rmarkdown::render("README.Rmd")'

      - name: Upload artifact para Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: .   # sube todos los archivos incluyendo README.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
